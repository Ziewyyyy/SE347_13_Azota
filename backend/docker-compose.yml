name: azota

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: azota-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - azota_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-app:
    build: .
    image: ${DOCKER_USERNAME:-local}/azota-backend:latest
    container_name: azota-backend-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./src:/app/src

volumes:
  azota_postgres_data:
